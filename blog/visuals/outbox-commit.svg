<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 368" role="img" aria-labelledby="outbox-commit-title outbox-commit-desc">
<title id="outbox-commit-title">Commit the change and event intent together</title>
<desc id="outbox-commit-desc">The loan update and event 101 commit in one database transaction; a later relay publishes outside that transaction.</desc>
<defs><style>/* Diagram palette follows the existing scrapbook preview, not a new theme. */
.visual-steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 1.5rem; margin: 2rem 0; }
{ margin: 0; min-width: 0; padding: 1rem 0; border-top: 2px solid var(--ss-ink, #19242d); }
svg, img { display: block; width: 100%; max-width: 360px; height: auto; margin: 0 auto; overflow: visible; }
figcaption { margin: .8rem 0 0; font: 1rem/1.55 Arial, sans-serif; color: var(--ss-ink, #19242d); }
figcaption strong { display: block; margin-bottom: .35rem; }
.visual-facts { font: .9rem/1.5 Arial, sans-serif !important; margin: .5rem 0 !important; }
.v-node { fill: var(--ss-card, #faf8f3); stroke: #657780; stroke-width: 1.5; }
.v-focus { fill: #f2dfd6; stroke: var(--ss-accent, #b75f49); stroke-width: 2; }
.v-boundary { fill: none; stroke: #657780; stroke-width: 1.5; stroke-dasharray: 4 4; }
.v-link { fill: none; stroke: #657780; stroke-width: 1.5; }
.v-label { fill: var(--ss-ink, #19242d); font: 16px Arial, sans-serif; }
.v-heading { fill: var(--ss-ink, #19242d); font: bold 16px Arial, sans-serif; }
.v-index { fill: #4a5a64; font: 16px ui-monospace, monospace; }
.v-value { fill: var(--ss-ink, #19242d); font: 24px ui-monospace, monospace; }
.v-mask { fill: var(--ss-paper, #f1eee8); }
.visual-wide { max-width: 440px; }
.bat-code-figure { margin: 2rem 0; min-width: 0; }
.bat-code-view { max-width: 100%; overflow-x: auto; background: #1e1e2e; border-radius: .4rem; }
.bat-code-view img { display: block; width: 875px; max-width: none; height: auto; }
.bat-code-view:focus-visible { outline: 3px solid #cba6f7; outline-offset: 3px; }
.bat-code-figure figcaption { margin-top: .7rem; font: .9rem/1.5 Arial, sans-serif; }
.bat-selectable-code { margin: 1rem 0 2rem; }
.bat-selectable-code summary { cursor: pointer; padding: .8rem 0; font: 700 1rem/1.5 Arial, sans-serif; }
.bat-selectable-code summary:focus-visible { outline: 3px solid #b75f49; outline-offset: 3px; }
</style>
<marker id="outbox-commit-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#657780"/></marker>
<marker id="outbox-commit-arrow-accent" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#b75f49"/></marker>
<marker id="outbox-commit-arrow-link" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#657780"/></marker>
</defs>
<rect x="16" y="16" width="288" height="216" rx="4" class="v-boundary"/><text x="160" y="48" class="v-heading" text-anchor="middle">One database transaction</text><line x1="160" y1="236" x2="160" y2="280" class="v-link" marker-end="url(#outbox-commit-arrow)"/><rect x="176" y="248" width="120" height="24" rx="4" class="v-mask"/><text x="184" y="268" class="v-label" text-anchor="start">committed</text><rect x="40" y="72" width="240" height="56" rx="4" class="v-node"/><text x="160" y="96" class="v-heading" text-anchor="middle">Loan 1</text><text x="160" y="116" class="v-index" text-anchor="middle">status = returned</text><rect x="40" y="152" width="240" height="56" rx="4" class="v-focus"/><text x="160" y="176" class="v-heading" text-anchor="middle">Outbox event 101</text><text x="160" y="196" class="v-index" text-anchor="middle">loan.returned</text><rect x="40" y="288" width="240" height="64" rx="4" class="v-node"/><text x="160" y="312" class="v-heading" text-anchor="middle">Relay reads the outbox</text><text x="160" y="336" class="v-label" text-anchor="middle">Broker write is separate</text>
</svg>